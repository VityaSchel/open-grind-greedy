[package]
name = "greedy"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
fastembed = { version = "5", default-features = false, features = [
	"ort-download-binaries-rustls-tls",
	"hf-hub-rustls-tls",
] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "0.13.4", default-features = false, features = [
	"json",
	"rustls-no-provider",
] }
rustls = { version = "0.23.45", default-features = false, features = [
	"ring",
	"std",
	"tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
tokio = { version = "1.53.0", features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
	"signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
panic = "abort"
